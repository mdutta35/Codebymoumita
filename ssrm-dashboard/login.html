<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSRM Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
    }

    .login-wrapper {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background-color: #ffffff;
      display: flex;
      max-width: 1000px;
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
      flex-wrap: wrap;
    }

    .login-left {
      flex: 1;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .login-left img {
      width: 100%;
      max-width: 600px;
      height: auto;
    }

    .login-right {
      flex: 1;
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-right .logo {
      text-align: right;
      margin-bottom: 20px;
    }

    .login-right h4 {
      color: #00a89d;
      font-weight: 600;
      margin-bottom: 25px;
    }

    .form-control {
      background-color: #f1f5f9;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 10px 15px;
      font-size: 15px;
    }

    .btn-login {
      background-color: #1252a0;
      color: #fff;
      border: none;
      width: 100%;
      padding: 10px;
      font-weight: 500;
      margin-top: 10px;
    }

    .btn-login:hover {
      background-color: #0c3c7c;
    }

    .text-link {
      font-size: 14px;
      color: #00a89d;
      text-decoration: none;
    }

    .text-link:hover {
      text-decoration: underline;
    }

    .footer-note {
      text-align: center;
      font-size: 14px;
      margin-top: 30px;
      color: #555;
    }

    .footer-note img {
      margin-top: 10px;
      max-height: 35px;
    }

    @media (max-width: 768px) {
      .login-container {
        flex-direction: column;
      }

      .login-left,
      .login-right {
        width: 100%;
      }

      .login-left {
        padding: 20px;
      }

      .login-right {
        padding: 30px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="login-wrapper">
    <div class="login-container">

      <!-- Left Image -->
      <div class="login-left">
        <img src="images/secure-login-and-sign-up-concept-illustration-vector.jpg" alt="Secure Login">
      </div>

      <!-- Right Form -->
      <div class="login-right">
        <div class="logo">
          <img src="images/SSRM lOGO.png" alt="SSRM Logo" height="30">
        </div>

        <h4>Corporate Login</h4>

        <form>
          <div class="mb-3">
            <input type="text" class="form-control" placeholder="User Name" required>
          </div>

          <div class="mb-3">
            <input type="password" class="form-control" placeholder="Password" required>
          </div>

          <!-- <div class="d-flex justify-content-end mb-2">
            <a href="#" class="text-link">Sign In</a>
          </div> -->

          <button type="submit" class="btn btn-login">Login</button>

          <div class="text-center mt-2">
            <a href="#" class="text-link">Forget Password? Click Here</a>
          </div>
        </form>

        <div class="footer-note">
          <p>This solution was brought to you by</p>
          <img src="images/SSRM lOGO.png" alt="SSRM Diagnostic Logo">
        </div>
      </div>
    </div>
  </div>

</body>

</html>
