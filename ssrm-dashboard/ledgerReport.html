<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSRM | Corporate Reports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    :root {
      --primary-color: #0B5FA8;
      --secondary-color: #ADD1EB;
      --light-gray: #f4f6f9;
      --hover-bg: #eaf3fc;
      --text-dark: #1a1a1a;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--light-gray);
      color: var(--text-dark);
    }

    .header {
      background: #fff;
      padding: 15px 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header .logo img {
      width: 100px;
      height: auto;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-info .circle {
      width: 36px;
      height: 36px;
      background-color: var(--primary-color);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .sidebar {
      width: 260px;
      background: linear-gradient(180deg, #0B5FA8, #1971C2);
      color: white;
      height: 100vh;
      position: fixed;
      top: 70px;
      left: 0;
      display: flex;
      flex-direction: column;
      padding: 20px 15px;
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
      transition: left 0.3s ease;
      z-index: 999;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
    }

    .sidebar ul li {
      margin-bottom: 12px;
    }

    .sidebar ul li a {
      text-decoration: none;
      color: white;
      display: flex;
      align-items: center;
      padding: 12px 15px;
      border-radius: 10px;
      transition: 0.3s;
    }

    .sidebar ul li a:hover,
    .sidebar ul li a.active {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .sidebar ul li a i {
      margin-right: 12px;
      font-size: 16px;
    }

    .main {
      margin-left: 260px;
      padding: 100px 30px 40px;
    }

    .card-custom {
      background-color: #fff;
      border-radius: 15px;
      padding: 0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.07);
    }

    .card-header-custom {
      background-color: var(--secondary-color);
      color: var(--text-dark);
      padding: 20px;
      border-top-left-radius: 15px;
      border-top-right-radius: 15px;
    }

    .card-header-custom h4 {
      margin: 0;
      font-weight: bold;
      text-align: center;
    }

    .balance-box {
      background-color: #fefefe;
      padding: 15px 20px;
      font-weight: bold;
      color: #e53935;
      text-align: center;
      border-bottom: 1px solid #dee2e6;
    }

    .btn-primary {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
    }

    .btn-primary:hover {
      background-color: #084c85;
      border-color: #084c85;
    }

    .input-group-text {
      background-color: var(--secondary-color);
    }

    .form-control:focus {
      box-shadow: none;
      border-color: var(--primary-color);
    }

    .toggle-sidebar-btn {
      display: none;
      background: none;
      border: none;
      font-size: 24px;
      color: var(--primary-color);
    }

    .table-responsive {
      margin-top: 20px;
      overflow-x: auto;
    }

    table {
      min-width: 1000px;
    }

    .table th {
      background-color: var(--secondary-color);
      text-align: center;
    }

    .table td {
      text-align: center;
    }

    .table-striped>tbody>tr:nth-of-type(odd) {
      background-color: #f9fcff;
    }

    @media (max-width: 992px) {
      .main {
        margin-left: 0 !important;
        padding: 100px 15px 40px;
      }

      .sidebar {
        left: -260px;
      }

      .sidebar.active {
        left: 0;
      }

      .toggle-sidebar-btn {
        display: inline-block;
        margin-right: 10px;
      }

      .user-info span {
        display: none;
      }
    }

    @media (max-width: 576px) {
      .card-header-custom h4 {
        font-size: 18px;
      }

      .table-responsive {
        font-size: 11px;
        overflow-x: scroll;
        width:300px;
      }

      .table td,
      .table th {
        padding: 4px;
        white-space: nowrap;
        width:50px;
      }

      .table th:nth-child(1),
      .table td:nth-child(1) {
        min-width: 20px;
        max-width: 20px;
        text-align: left;
        position: sticky;
        z-index: 1;
        left: 0;
      }


      /* .table th:nth-child(1),
      .table th:nth-child(2),
      .table td:nth-child(1),
      .table td:nth-child(2) {
        position: sticky;
        left: 0;
        background-color: #f1f1f1;
        z-index: 1;
      }

      .table th:nth-child(2),
      .table td:nth-child(2) {
        left: 50px;
        z-index: 1;
      }

      .table th:nth-child(1),
      .table td:nth-child(1) {
        min-width: 40px;
        max-width: 40px;
        text-align: left;
      }

      .table th:nth-child(2),
      .table td:nth-child(2) {
        min-width: 60px;
        max-width: 60px;
      } */
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="header">
    <div class="d-flex align-items-center">
      <button class="toggle-sidebar-btn d-lg-none" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
      </button>
      <div class="logo">
        <img src="images/SSRM lOGO.png" alt="logo">
      </div>
    </div>
    <div class="user-info">
      <div class="circle">A</div>
      <span>admin@example.com</span>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <ul>
      <li><a href="corporateReport.html"><i class="fa fa-file-alt"></i> Corporate Reports</a></li>
      <li><a href="price.html"><i class="fa fa-vials"></i> Test Prices</a></li>
      <li><a href="billRegister.html"><i class="fa fa-book"></i> Bill Register</a></li>
      <li><a class="active" href="ledgerReport.html"><i class="fa fa-book"></i> Ledger Report</a></li>
      <li><a href="#"><i class="fa fa-sign-out-alt"></i> Logout</a></li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main">
    <div class="card-custom">
      <div class="card-header-custom">
        <h4>Ledger Report</h4>
      </div>
      <div class="balance-box">
        CC Balance : ₹ 502.00 Dr
      </div>

      <div class="p-4">
        <!-- Search Filters -->
        <div class="row flex-nowrap g-2">
          <div class="col-4 d-flex flex-column">
            <label class="form-label">From Date</label>
            <div class="input-group">
              <input type="date" class="form-control" value="2025-04-02" />
              <span class="input-group-text"><i class="fa fa-calendar"></i></span>
            </div>
          </div>
          <div class="col-4 d-flex flex-column">
            <label class="form-label">To Date</label>
            <div class="input-group">
              <input type="date" class="form-control" value="2025-08-02" />
              <span class="input-group-text"><i class="fa fa-calendar"></i></span>
            </div>
          </div>
          <div class="col-4 d-flex align-items-end">
            <button class="btn btn-primary w-100 mt-2 mt-md-0">
              <i class="fa fa-search me-2"></i><span class="d-none d-md-inline">Search</span>
            </button>
          </div>
        </div>

       

        <!-- Table -->
        <div class="table-responsive">
          <table class="table table-bordered table-striped">
            <thead>
              <tr>
                <th>Particulars</th>
                
                <th>Debit</th>
                <th>Credit</th>
                
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Opening Balance</td>
                
                <td>250.00</td>
                <td>0.00</td>
                
              </tr>
              <tr>
                <td>Sale Value</td>
                
                <td>90.00</td>
                <td>0.00</td>
                
              </tr>
              <tr>
                <td>Adjustment during Payment</td>
                
                <td>1980.00</td>
                <td>206</td>
                
              </tr>
              <tr>
                <td>Payment Received</td>
                
                <td>4120.00</td>
                <td>0.00</td>
                
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    function toggleSidebar() {
      document.querySelector('.sidebar').classList.toggle('active');
    }
  </script>
</body>

</html>
