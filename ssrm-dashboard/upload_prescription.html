<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSRM | Corporate Reports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

  <style>
    :root {
      --primary-color: #0B5FA8;
      --secondary-color: #ADD1EB;
      --light-gray: #f4f6f9;
      --hover-bg: #eaf3fc;
      --text-dark: #1a1a1a;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--light-gray);
      color: var(--text-dark);
    }

    .header {
      background: #fff;
      padding: 15px 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header .logo img {
      width: 100px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-info .circle {
      width: 36px;
      height: 36px;
      background-color: var(--primary-color);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .sidebar {
      width: 260px;
      background: linear-gradient(180deg, #0B5FA8, #1971C2);
      color: white;
      height: 100vh;
      position: fixed;
      top: 70px;
      left: 0;
      padding: 20px 15px;
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
      z-index: 999;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
    }

    .sidebar ul li {
      margin-bottom: 12px;
    }

    .sidebar ul li a {
      text-decoration: none;
      color: white;
      display: flex;
      align-items: center;
      padding: 12px 15px;
      border-radius: 10px;
    }

    .sidebar ul li a:hover,
    .sidebar ul li a.active {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .sidebar ul li a i {
      margin-right: 12px;
    }

    .main {
      margin-left: 260px;
      padding: 100px 30px 40px;
    }

    .card-custom {
      background-color: #fff;
      border-radius: 15px;
      padding: 0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.07);
    }

    .card-header-custom {
      background-color: var(--secondary-color);
      padding: 20px;
      border-top-left-radius: 15px;
      border-top-right-radius: 15px;
    }

    .card-header-custom h4 {
      margin: 0;
      font-weight: bold;
      text-align: center;
    }

    .balance-box {
      background-color: #fefefe;
      padding: 15px 20px;
      font-weight: bold;
      color: #e53935;
      text-align: center;
      border-bottom: 1px solid #dee2e6;
    }

    .upload-section {
      padding: 20px;
    }

    .upload-section .form-control {
      font-size: 14px;
    }

    .btn-primary {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
    }

    .btn-primary:hover {
      background-color: #084c85;
      border-color: #084c85;
    }

    .toggle-sidebar-btn {
      display: none;
      background: none;
      border: none;
      font-size: 24px;
      color: var(--primary-color);
    }

    .table-responsive {
      overflow-x: auto;
      margin-top: 20px;
    }

    table {
      min-width: 900px;
    }

    th,
    td {
      text-align: center;
      vertical-align: middle;
    }

    .table th {
      background-color: var(--secondary-color);
    }

    .table-striped>tbody>tr:nth-of-type(odd) {
      background-color: #f9fcff;
    }

    @media (max-width: 992px) {
      .main {
        margin-left: 0 !important;
        padding: 100px 15px 40px;
      }

      .sidebar {
        left: -260px;
      }

      .sidebar.active {
        left: 0;
      }

      .toggle-sidebar-btn {
        display: inline-block;
        margin-right: 10px;
      }

      .user-info span {
        display: none;
      }
    }

    @media (max-width: 768px) {
      .upload-section .d-flex {
        flex-direction: column;
        gap: 10px;
      }

      .responsive-btn {
        padding: 4px 10px;
        font-size: 12px;
        white-space: nowrap;
        flex: 1 1 auto;
      }

      .table-responsive {
        font-size: 11px;
      }

      table {
        min-width: 700px;
      }

      .table th:nth-child(1),
      .table td:nth-child(1) {
        min-width: 50px;
        max-width: 50px;
      }

      .table th:nth-child(2),
      .table td:nth-child(2) {
        min-width: 140px;
        max-width: 140px;
      }
    }

    @media (max-width: 576px) {
      .table th:nth-child(1),
      .table td:nth-child(1),
      .table th:nth-child(2),
      .table td:nth-child(2) {
        position: sticky;
        left: 0;
        background-color: #f1f1f1;
        z-index: 1;
      }

      .table th:nth-child(1),
      .table td:nth-child(1) {
        width: 10px;
      }

      .table th:nth-child(2),
      .table td:nth-child(2) {
        width: 50px;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="header">
    <div class="d-flex align-items-center">
      <button class="toggle-sidebar-btn d-lg-none" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
      </button>
      <div class="logo">
        <img src="images/SSRM lOGO.png" alt="logo">
      </div>
    </div>
    <div class="user-info">
      <div class="circle">A</div>
      <span>admin@example.com</span>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <ul>
      <li><a href="corporateReport.html"><i class="fa fa-file-alt"></i> Corporate Reports</a></li>
      <li><a class="active" href="price.html"><i class="fa fa-vials"></i> Test Prices</a></li>
      <li><a href="billRegister.html"><i class="fa fa-book"></i> Bill Register</a></li>
      <li><a href="ledgerReport.html"><i class="fa fa-book"></i> Ledger Report</a></li>
      <li><a href="#"><i class="fa fa-sign-out-alt"></i> Logout</a></li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main">
    <div class="card-custom">
      <div class="card-header-custom">
        <h4>Upload Prescription</h4>
      </div>
      <div class="balance-box">
        CC Balance : ₹ 502.00 Dr
      </div>

      <!-- Upload Section -->
      <div class="upload-section">
        <form>
          <div class="row g-2 align-items-center d-flex">
            <div class="col-md-4">
              <input type="text" class="form-control" placeholder="Enter Bill ID" required />
            </div>
            <div class="col-md-5">
              <input type="file" class="form-control" accept=".jpg,.jpeg,.pdf" required />
            </div>
            <div class="col-md-3">
              <button type="submit" class="btn btn-primary w-100">Upload</button>
            </div>
          </div>
        </form>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script>
    $(document).ready(function () {
      $('#testSelect').select2({
        placeholder: "Select Test Name",
        allowClear: true,
        width: '100%'
      });
    });

    function toggleSidebar() {
      document.querySelector('.sidebar').classList.toggle('active');
    }
  </script>
</body>

</html>
